<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Landing Page</title>
  <style>
    /* CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Variables */
    :root {
      --primary-color: #4CAF50; /* Green */
      --secondary-color: #2196F3; /* Blue */
      --text-color: #333;
      --background-color: #f4f4f4;
      --accent-color: #FF9800; /* Orange */
    }

    /* Base Styles */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--background-color);
      overflow-x: hidden; /* Prevents horizontal scroll */
    }

    /* Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    header {
      background-color: var(--secondary-color);
      color: white;
      padding: 20px 0;
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
    }

    /* Main Content */
    main {
      text-align: center;
      padding: 40px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    main h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    main p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #777;
    }

    /* Button */
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: var(--primary-color);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
      font-size: 1.1rem;
    }

    .btn:hover {
      background-color: darken(var(--primary-color), 10%);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      margin-top: 30px;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    main {
      animation: fadeIn 1s ease-out;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }

      main h2 {
        font-size: 1.75rem;
      }

      main p {
        font-size: 1.1rem;
      }

      .container {
        padding: 15px;
      }

      header {
        padding: 15px 0;
        margin-bottom: 20px;
      }

      main {
        padding: 30px;
      }

      .btn {
        font-size: 1rem;
        padding: 10px 20px;
      }

      footer {
        padding: 15px;
        margin-top: 20px;
      }
    }

    /* JavaScript Animations */
    .fade-in {
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .fade-in.active {
      opacity: 1;
    }

    .slide-in {
      transform: translateY(50px);
      transition: transform 1s ease-in-out, opacity 1s ease-in-out;
      opacity: 0;
    }

    .slide-in.active {
      transform: translateY(0);
      opacity: 1;
    }

  </style>
</head>
<body>

  <header>
    <div class="container">
      <h1>Welcome!</h1>
    </div>
  </header>

  <main class="fade-in">
    <div class="container">
      <h2 class="slide-in">Hello, World!</h2>
      <p class="slide-in" style="transition-delay: 0.2s;">This is a simple landing page built with modern HTML, CSS, and JavaScript.</p>
      <a href="#" class="btn slide-in" style="transition-delay: 0.4s;">Learn More</a>
    </div>
  </main>

  <footer>
    <div class="container">
      &copy; 2024 My Awesome Website
    </div>
  </footer>

  <script>
    // Simple Scroll Animation (Intersection Observer)
    const elements = document.querySelectorAll('.fade-in, .slide-in');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
          observer.unobserve(entry.target); // Stop observing after animation
        }
      });
    });

    elements.forEach(element => {
      observer.observe(element);
    });

    // Prevent default behavior for demonstration purposes
    document.querySelector('.btn').addEventListener('click', function(event) {
      event.preventDefault();
      alert('Button Clicked!');
    });

  </script>

</body>
</html>
